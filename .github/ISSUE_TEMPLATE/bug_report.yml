# SPDX-License-Identifier: GPL-3.0-or-later
name: Bug report
description: Report a problem with Desktop Checkup.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, personal files, or other private information.
  - type: input
    id: version
    attributes:
      label: App version
      description: Which release or source version are you using?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Ubuntu or Zorin OS version and GNOME version, if known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
