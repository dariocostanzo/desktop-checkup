# SPDX-License-Identifier: GPL-3.0-or-later
name: Request a new check
description: Suggest a local system check to add.
title: "[New check]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What should the check look for?
      description: Describe the problem in beginner-friendly terms.
    validations:
      required: true
  - type: textarea
    id: meaning
    attributes:
      label: What should each result mean?
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Which systems or hardware does this affect?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: This check can use local system information and does not need network access.
          required: true
        - label: I have described any changes or administrator access it would need.
          required: true
